name: Deploy

on:
  workflow_dispatch:
  repository_dispatch:
    types: [deploy]

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Código do backend
        uses: actions/checkout@v4
        with:
          repository: ebert-g/TEDUND1BESNOTT1GR5_BACK
          ref: main
          path: back
          token: ${{ secrets.SOURCE_TOKEN }}
          persist-credentials: false

      - name: Código do frontend
        uses: actions/checkout@v4
        with:
          repository: ebert-g/TEDUND1BESNOTT1GR5_FRONT
          ref: main
          path: front
          token: ${{ secrets.SOURCE_TOKEN }}
          persist-credentials: false

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Nomes das imagens
        id: imagens
        run: |
          base="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "back=$base/back" >> "$GITHUB_OUTPUT"
          echo "front=$base/front" >> "$GITHUB_OUTPUT"

      - name: Build e push do backend
        uses: docker/build-push-action@v6
        with:
          context: back
          file: docker/back.Dockerfile
          push: true
          tags: ${{ steps.imagens.outputs.back }}:latest
          cache-from: type=gha,scope=back
          cache-to: type=gha,scope=back,mode=max

      - name: Build e push do frontend
        uses: docker/build-push-action@v6
        with:
          context: front
          file: docker/front.Dockerfile
          push: true
          tags: ${{ steps.imagens.outputs.front }}:latest
          cache-from: type=gha,scope=front
          cache-to: type=gha,scope=front,mode=max

      - name: Publicar na VM
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_USER: ${{ secrets.VM_USER }}
          VM_SSH_KEY: ${{ secrets.VM_SSH_KEY }}
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BACK_IMAGE: ${{ steps.imagens.outputs.back }}:latest
          FRONT_IMAGE: ${{ steps.imagens.outputs.front }}:latest
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$VM_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$VM_HOST" >> ~/.ssh/known_hosts
          scp -i ~/.ssh/deploy_key deploy/docker-compose.yml deploy/Caddyfile "$VM_USER@$VM_HOST:/opt/monitoria/"
          printf '%s' "$REGISTRY_TOKEN" | ssh -i ~/.ssh/deploy_key "$VM_USER@$VM_HOST" \
            "docker login ghcr.io -u '$REGISTRY_USER' --password-stdin \
             && cd /opt/monitoria \
             && export BACK_IMAGE='$BACK_IMAGE' FRONT_IMAGE='$FRONT_IMAGE' \
             && docker compose pull \
             && docker compose up -d \
             && docker image prune -f \
             && docker logout ghcr.io"
