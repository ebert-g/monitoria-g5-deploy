services:
  postgres:
    image: postgres:18
    container_name: sistema-monitoria-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-sistema_monitoria}
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql

volumes:
  postgres_data: