<form class="busca" [formGroup]="formulario" (ngSubmit)="enviar()">
  <mat-form-field>
    <mat-label>{{ rotulo() }}</mat-label>
    <input matInput type="number" min="1" formControlName="id" />
    <mat-error>Informe um ID válido.</mat-error>
  </mat-form-field>

  <button mat-flat-button type="submit">
    <mat-icon>search</mat-icon>
    Buscar
  </button>
</form>
